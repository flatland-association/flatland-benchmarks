# Additive override, opted into only via COMPOSE_FILE when a prebuilt ci-<hash> image is confirmed to exist.
# Clears build: (Compose Specification's !reset merge tag, see
# https://github.com/compose-spec/compose-spec/blob/master/13-merge.md) so an unconditional `docker compose
# build` — as run by the ai4realnet-orchestrators external test fixture, which ignores pull_policy entirely —
# has nothing to build for these two services and just uses the already-pulled image: tag as-is. Must be the
# LAST file in COMPOSE_FILE: any override merged after this one that touches build.* (e.g.
# docker-compose.ci-cache.yml's cache_from/cache_to) would resurrect a build section with no context/dockerfile,
# breaking `build`.
services:
  fab-backend:
    build: !reset null

  fab-frontend:
    build: !reset null
