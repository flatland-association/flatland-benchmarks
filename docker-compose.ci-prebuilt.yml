# Additive override, opted into only via COMPOSE_FILE when a prebuilt ci-<hash> image is confirmed to exist.
# Clears build: (Compose Specification's !reset merge tag, see
# https://github.com/compose-spec/compose-spec/blob/master/13-merge.md) so an unconditional `docker compose
# build` — as run by the ai4realnet-orchestrators external test fixture, which ignores pull_policy entirely —
# has nothing to build for these two services and just uses the already-pulled image: tag as-is. Must come
# after docker-compose.yml (the base build: definition it resets) — currently the only other file ever named
# in COMPOSE_FILE alongside this one, so there's no other build.*-touching override left to order against.
services:
  fab-backend:
    build: !reset null

  fab-frontend:
    build: !reset null
