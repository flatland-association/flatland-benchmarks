name: Install openapi-generator-cli
description: Installs the pinned openapi-generator-cli version used across workflows to generate/validate the fab-clientlib OpenAPI client.
inputs:
  extra-packages:
    description: Additional pip packages to install alongside openapi-generator-cli (space-separated)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install openapi-generator-cli==7.15.0 ${{ inputs.extra-packages }}
