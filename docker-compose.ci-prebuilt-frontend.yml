# Additive override, opted into (independently of docker-compose.ci-prebuilt-backend.yml) only via
# COMPOSE_FILE when a prebuilt ci-<hash> image for fab-frontend is confirmed to exist. Clears build: (Compose
# Specification's !reset merge tag, see
# https://github.com/compose-spec/compose-spec/blob/master/13-merge.md) so an unconditional `docker compose
# build` — as run by the ai4realnet-orchestrators external test fixture, which ignores pull_policy entirely —
# has nothing to build for this service and just uses the already-pulled image: tag as-is. Must come after
# docker-compose.yml (the base build: definition it resets).
services:
  fab-frontend:
    build: !reset null
